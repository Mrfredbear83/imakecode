<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #36393f;
      color: #dcddde;
    }
    .members-count {
      padding: 10px;
      font-weight: bold;
      border-bottom: 1px solid #2f3136;
    }
    .chat-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .members-list {
      width: 200px;
      border-right: 1px solid #2f3136;
      padding: 10px;
      overflow-y: auto;
      background-color: #2f3136;
    }
    .messages-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }
    .message {
      margin-bottom: 10px;
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 8px;
      word-wrap: break-word;
      background-color: #40444b;
    }
    .message.system {
      background-color: transparent;
      color: #f04747;
      font-style: italic;
      max-width: 100%;
    }
    .message .member {
      font-weight: bold;
      margin-right: 5px;
    }
    .timestamp {
      font-size: 10px;
      color: #72767d;
      margin-left: 5px;
    }
    .message-form {
      display: flex;
      padding: 10px;
      border-top: 1px solid #2f3136;
      background-color: #40444b;
    }
    .message-form input[type=text] {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    .message-form input[type=submit] {
      margin-left: 10px;
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      background-color: #7289da;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="members-count">Users in room: 0</div>
  <div class="chat-container">
    <div class="members-list">-</div>
    <div class="messages-container">
      <div class="messages"></div>
      <form class="message-form" onsubmit="return false;">
        <input type="text" placeholder="Type a message..."/>
        <input type="submit" value="Send"/>
      </form>
    </div>
  </div>

  <script>
  const CLIENT_ID = '4cNswoNqM2wVFHPg'; // replace with your own ScaleDrone ID

  const bannedUsers = [];
  const mutedUsers = [];
  let members = [];

  const DOM = {
    membersCount: document.querySelector('.members-count'),
    membersList: document.querySelector('.members-list'),
    messages: document.querySelector('.messages'),
    input: document.querySelector('.message-form input[type=text]'),
    form: document.querySelector('.message-form')
  };

  const drone = new ScaleDrone(CLIENT_ID, {
    data: {
      name: getName(),
      color: getRandomColor()
    }
  });

  drone.on('open', error => {
    if (error) return console.error(error);

    const room = drone.subscribe('observable-room');
    room.on('open', error => {
      if (error) return console.error(error);
      addSystemMessage("Joined the room");
    });

    room.on('members', m => {
      members = m;
      updateMembersDOM();
    });

    room.on('member_join', member => {
      members.push(member);
      updateMembersDOM();
      addSystemMessage(member.clientData.name + " joined the room");
    });

    room.on('member_leave', ({id}) => {
      const member = members.find(m => m.id === id);
      if(member) addSystemMessage(member.clientData.name + " left the room");
      members = members.filter(m => m.id !== id);
      updateMembersDOM();
    });

    room.on('data', (text, member) => {
      if(!member) return;
      if(bannedUsers.includes(member.id) || mutedUsers.includes(member.id)) return;
      addMessageToListDOM(text, member);
    });

  });

  drone.on('close', event => console.log("Connection closed", event));
  drone.on('error', error => console.error(error));

  function getName() {
    let name = prompt("Enter your name:");
    if(!name || name.trim() === "") name = "Anonymous";
    return name.trim();
  }

  function getRandomColor() {
    return '#' + ('000000' + Math.floor(Math.random()*16777215).toString(16)).slice(-6);
  }

  DOM.form.addEventListener('submit', sendMessage);

  function sendMessage() {
    const value = DOM.input.value.trim();
    if(value === '') return;
    DOM.input.value = '';

    // commands
    if(value.startsWith("/")) handleCommand(value);
    else drone.publish({room: 'observable-room', message: value});
  }

  function handleCommand(text) {
    const parts = text.split(" ");
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(" ").trim();

    switch(cmd) {
      case "/ban":
        if(!arg) return addSystemMessage("Usage: /ban username");
        banUser(arg);
        break;
      case "/mute":
        if(!arg) return addSystemMessage("Usage: /mute username");
        muteUser(arg);
        break;
      case "/help":
        addSystemMessage("Commands: /ban username, /mute username, /users, /help");
        break;
      case "/users":
        addSystemMessage("Users: " + members.map(m=>m.clientData.name).join(", "));
        break;
      default:
        addSystemMessage("Unknown command: " + cmd);
    }
  }

  function banUser(username) {
    const member = members.find(m => m.clientData.name === username);
    if(!member) return addSystemMessage("error name not found");
    bannedUsers.push(member.id);
    members = members.filter(m => m.id !== member.id);
    updateMembersDOM();
    addSystemMessage("[SYSTEM] " + username + " was banned");
  }

  function muteUser(username) {
    const member = members.find(m => m.clientData.name === username);
    if(!member) return addSystemMessage("error name not found");
    mutedUsers.push(member.id);
    addSystemMessage("[SYSTEM] " + username + " was muted");
  }

  function updateMembersDOM() {
    DOM.membersCount.innerText = `Users in room: ${members.length}`;
    DOM.membersList.innerHTML = '';
    members.forEach(member => {
      const div = document.createElement('div');
      div.textContent = member.clientData.name;
      div.style.color = member.clientData.color;
      DOM.membersList.appendChild(div);
    });
  }

  function createMessageElement(text, member) {
    const el = document.createElement("div");
    el.className = "message";

    const nameSpan = document.createElement("span");
    nameSpan.textContent = member.clientData.name;
    nameSpan.className = "member";
    nameSpan.style.color = member.clientData.color;

    const timestamp = document.createElement("span");
    const time = new Date();
    timestamp.textContent = time.getHours().toString().padStart(2,'0') + ":" + time.getMinutes().toString().padStart(2,'0');
    timestamp.className = "timestamp";

    const content = document.createTextNode(" " + text);

    el.appendChild(nameSpan);
    el.appendChild(timestamp);
    el.appendChild(content);
    return el;
  }

  function addMessageToListDOM(text, member) {
    const el = createMessageElement(text, member);
    DOM.messages.appendChild(el);
    DOM.messages.scrollTop = DOM.messages.scrollHeight;
  }

  function addSystemMessage(text) {
    const el = document.createElement("div");
    el.className = "message system";
    el.textContent = text;
    DOM.messages.appendChild(el);
    DOM.messages.scrollTop = DOM.messages.scrollHeight;
  }
  </script>
</body>
</html>
